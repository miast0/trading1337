<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Trading 1337 — social cryptocurrency trading">
  <title>Trading 1337</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%2378e7bc%22/><path d=%22M25 31h50M50 31v45M34 47h32%22 stroke=%22%230b0d0f%22 stroke-width=%2211%22 stroke-linecap=%22round%22/></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <section class="auth-brand">
      <div class="brand brand-large"><span class="brand-mark">T</span><span>Trading <b>1337</b></span></div>
      <div class="auth-pitch">
        <p class="eyebrow">Social cryptocurrency trading</p>
        <h1>Trade the market.<br><span>Find your edge.</span></h1>
        <p class="pitch-copy">Follow traders, copy moves and build your cryptocurrency portfolio with live market prices.</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-mobile-brand brand"><span class="brand-mark">T</span><span>Trading <b>1337</b></span></div>
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-auth-tab="login">Log in</button>
          <button class="auth-tab" data-auth-tab="register">Create account</button>
        </div>
        <form id="login-form" class="auth-form">
          <div><label for="login-username">Email or username</label><input id="login-username" name="identifier" autocomplete="username" placeholder="Enter your email or username" required></div>
          <div><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
          <button class="primary-button wide" type="submit">Log in <span>→</span></button>
          <p class="form-error" id="login-error" role="alert"></p>
        </form>
        <form id="register-form" class="auth-form hidden">
          <div><label for="register-name">Name</label><input id="register-name" name="displayName" maxlength="40" placeholder="Enter your name" autocomplete="name" required></div>
          <div><label for="register-email">Email</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <div><label for="register-username">Username</label><div class="input-prefix"><span>@</span><input id="register-username" name="username" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="username" required></div></div>
          <div><label for="register-password">Password</label><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required></div>
          <div><label for="register-confirm-password">Confirm password</label><input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter your password again" required></div>
          <button class="primary-button wide" type="submit">Create account <span>→</span></button>
          <p class="form-error" id="register-error" role="alert"></p>
        </form>
      </div>
    </section>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">T</span><span>Trading <b>1337</b></span></div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span><span>Home</span></button>
        <button class="nav-item" data-route="markets"><span class="nav-icon">⌕</span><span>Markets</span></button>
        <button class="nav-item" data-route="portfolio"><span class="nav-icon">◔</span><span>Portfolio</span></button>
        <div class="nav-group" id="discover-nav">
          <button class="nav-item nav-heading" data-nav-toggle="discover" aria-expanded="false"><span class="nav-icon">♜</span><span>Discover</span><span class="nav-chevron">›</span></button>
          <div class="nav-submenu hidden" id="discover-submenu">
            <button class="nav-subitem" data-route="discover"><span>♛</span><span>Leaderboard</span></button>
            <button class="nav-subitem" data-route="recent"><span>↗</span><span>Recent trades</span></button>
            <button class="nav-subitem" data-route="community"><span>◉</span><span>Community</span></button>
          </div>
        </div>
        <button class="nav-item" data-route="history"><span class="nav-icon">↻</span><span>History</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-route="transfer"><span class="nav-icon">⇄</span><span>Transfer</span></button>
        <button class="user-chip" data-route="profile"><span id="side-avatar" class="avatar small"></span><span><b id="side-name">Trader</b><small id="side-username">@trader</small></span><i>•••</i></button>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close navigation"></button>
    <main class="main-shell">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div class="search-wrap"><span>⌕</span><input id="global-search" placeholder="Search markets" aria-label="Search markets"><kbd>⌘ K</kbd></div>
        <div class="top-actions"><span class="live-pill"><i></i> Markets live</span><button class="primary-button compact" data-open-trade>Trade</button></div>
      </header>
      <div id="view" class="view"><div class="page-loader"><span></span><p>Opening the market…</p></div></div>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="active" data-route="home"><span>⌂</span>Home</button><button data-route="markets"><span>⌕</span>Markets</button><button class="mobile-trade" data-open-trade><span>＋</span></button><button data-route="community"><span>◉</span>Social</button><button data-route="portfolio"><span>◔</span>Portfolio</button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
