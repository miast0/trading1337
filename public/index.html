<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Trading 1337 — social cryptocurrency trading">
  <title>Trading 1337</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/></symbol>
    <symbol id="icon-markets" viewBox="0 0 24 24"><path d="M4 3v17h17 M7 14l4-5 4 3 6-8"/></symbol>
    <symbol id="icon-portfolio" viewBox="0 0 24 24"><path d="M13 3v8h8 M10 3a9 9 0 1 0 11 11 M16 3a9 9 0 0 1 5 5"/></symbol>
    <symbol id="icon-discover" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6Z"/></symbol>
    <symbol id="icon-rank" viewBox="0 0 24 24"><path d="M4 20V12h5v8 M9 20V4h6v16 M15 20V8h5v12"/></symbol>
    <symbol id="icon-trades" viewBox="0 0 24 24"><path d="M4 8h15l-4-4 M20 16H5l4 4"/></symbol>
    <symbol id="icon-community" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4Z M8 8h8 M8 12h5"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7 M3 4v6h6 M12 7v5l3 2"/></symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
  </defs></svg>
  <div id="auth-screen" class="auth-screen">
    <section class="auth-brand">
      <div class="brand brand-large"><span class="brand-mark" aria-hidden="true"><img src="/assets/brand.svg" alt=""></span><span>Trading <b>1337</b></span></div>
      <div class="auth-pitch">
        <p class="eyebrow">Social cryptocurrency trading</p>
        <h1>Your portfolio.<br><span>Your perspective.</span></h1>
        <p class="pitch-copy">Explore markets, follow traders and join the conversation.</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-mobile-brand brand"><span class="brand-mark" aria-hidden="true"><img src="/assets/brand.svg" alt=""></span><span>Trading <b>1337</b></span></div>
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-auth-tab="login">Log in</button>
          <button class="auth-tab" data-auth-tab="register">Create account</button>
        </div>
        <form id="login-form" class="auth-form">
          <div><label for="login-username">Email or username</label><input id="login-username" name="identifier" autocomplete="username" placeholder="Enter your email or username" required></div>
          <div><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
          <button class="primary-button wide" type="submit">Log in <span>→</span></button>
          <p class="form-error" id="login-error" role="alert"></p>
        </form>
        <form id="register-form" class="auth-form hidden">
          <div><label for="register-name">Name</label><input id="register-name" name="displayName" maxlength="40" placeholder="Enter your name" autocomplete="name" required></div>
          <div><label for="register-email">Email</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <div><label for="register-username">Username</label><div class="input-prefix"><span>@</span><input id="register-username" name="username" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="username" required></div></div>
          <div><label for="register-password">Password</label><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" required></div>
          <div><label for="register-confirm-password">Confirm password</label><input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter your password again" required></div>
          <button class="primary-button wide" type="submit">Create account <span>→</span></button>
          <p class="form-error" id="register-error" role="alert"></p>
        </form>
      </div>
    </section>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><img src="/assets/brand.svg" alt=""></span><span>Trading <b>1337</b></span></div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-route="home" title="Overview"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-home"/></svg></span><span>Overview</span></button>
        <button class="nav-item" data-route="markets" title="Markets"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-markets"/></svg></span><span>Markets</span></button>
        <button class="nav-item" data-route="portfolio" title="Portfolio"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-portfolio"/></svg></span><span>Portfolio</span></button>
        <div class="nav-group" id="discover-nav">
          <button class="nav-item nav-heading" data-nav-toggle="discover" aria-expanded="false" title="Discover"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-discover"/></svg></span><span>Discover</span><span class="nav-chevron">›</span></button>
          <div class="nav-submenu hidden" id="discover-submenu">
            <button class="nav-subitem" data-route="discover" title="Leaderboard"><svg class="ui-icon"><use href="#icon-rank"/></svg><span>Leaderboard</span></button>
            <button class="nav-subitem" data-route="recent" title="Recent trades"><svg class="ui-icon"><use href="#icon-trades"/></svg><span>Recent trades</span></button>
            <button class="nav-subitem" data-route="community" title="Community"><svg class="ui-icon"><use href="#icon-community"/></svg><span>Community</span></button>
          </div>
        </div>
        <button class="nav-item" data-route="history" title="History"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-history"/></svg></span><span>History</span></button>
        <button class="nav-item" data-route="transfer" title="Transfer"><span class="nav-icon"><svg class="ui-icon"><use href="#icon-trades"/></svg></span><span>Transfer</span></button>
      </nav>
      <div class="sidebar-account">
        <div class="account-menu hidden" id="account-menu" role="menu" aria-label="Account">
          <button type="button" data-route="profile" role="menuitem"><svg class="ui-icon" aria-hidden="true"><use href="#icon-profile"/></svg>My Profile</button>
          <button type="button" id="account-logout" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6 M9 12h12l-4-4 M21 12l-4 4"/></svg>Log Out</button>
        </div>
        <button type="button" class="account-toggle" id="account-toggle" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu"></button>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close navigation"></button>
    <main class="main-shell">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div class="search-wrap"><svg class="ui-icon" aria-hidden="true"><use href="#icon-search"/></svg><input id="global-search" placeholder="Search markets and users" aria-label="Search markets and users" maxlength="100" autocomplete="off"><kbd>⌘ K</kbd></div>
      </header>
      <div id="view" class="view"><div class="page-loader"><span></span><p>Opening the market…</p></div></div>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="active" data-route="home"><svg class="ui-icon"><use href="#icon-home"/></svg>Overview</button><button data-route="markets"><svg class="ui-icon"><use href="#icon-markets"/></svg>Markets</button><button data-route="community"><svg class="ui-icon"><use href="#icon-community"/></svg>Community</button><button data-route="portfolio"><svg class="ui-icon"><use href="#icon-portfolio"/></svg>Portfolio</button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
